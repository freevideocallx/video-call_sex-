<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Girls Global - Apps on Google Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-800 antialiased">

    <main class="max-w-md mx-auto min-h-screen bg-white pb-12 shadow-sm border-x border-gray-100">
        <!-- Header -->
        <section class="p-4 pt-6">
            <div class="flex items-start space-x-4">
                <img src="logo.png" alt="App Icon" class="w-20 h-20 rounded-2xl object-cover shadow-md flex-shrink-0">
                <div class="flex-1 min-w-0">
                    <h1 class="text-2xl font-normal text-gray-900 tracking-tight truncate">Hot Girls Global</h1>
                    <p class="text-emerald-700 font-medium text-sm mt-0.5">Global</p>
                    <p class="text-gray-500 text-xs mt-1">Contains ads &bull; In-app purchases</p>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-4 gap-2 mt-6 text-center divide-x divide-gray-100">
                <div class="flex flex-col items-center">
                    <div class="flex items-center text-xs font-bold text-gray-700">
                        <span>4.8</span>
                        <svg class="w-3 h-3 text-gray-700 ml-0.5 fill-current" viewBox="0 0 20 20"><path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/></svg>
                    </div>
                    <span class="text-[11px] text-gray-500 mt-1">500K reviews</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="border border-gray-400 rounded px-1 text-[10px] font-bold text-gray-700 leading-tight py-0.5">18+</div>
                    <span class="text-[11px] text-gray-500 mt-1">Rated for 18+</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="flex items-center text-xs font-bold text-gray-700">
                        <svg class="w-3.5 h-3.5 text-gray-700 mr-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        <span>14 MB</span>
                    </div>
                    <span class="text-[11px] text-gray-500 mt-1">Size</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="flex items-center text-xs font-bold text-gray-700"><span>10M+</span></div>
                    <span class="text-[11px] text-gray-500 mt-1">Downloads</span>
                </div>
            </div>

            <!-- Download Button -->
            <div class="mt-6">
                <!-- এখানে শুধু ফাইলের নাম দিলেই কাজ হবে -->
                <a href="Live video.apk" class="block w-full bg-[#1a73e8] hover:bg-[#1557b0] text-white font-medium py-3.5 px-4 rounded-full shadow transition-colors text-center text-base tracking-wide" download>
                    download
                </a>
            </div>
        </section>

        <!-- Banner -->
        <section class="mt-6 bg-purple-600 py-3 px-4">
            <div class="w-full rounded-xl overflow-hidden shadow-lg bg-purple-900 border border-purple-400/30">
                <img src="banner.png" alt="App Banner" class="w-full h-auto object-cover">
            </div>
        </section>

        <!-- About Section -->
        <section class="p-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-gray-900">About this app</h2>
            </div>
            <p class="text-gray-600 text-sm leading-relaxed">
                Live video call and chat with hot girls. Meet new friends and enjoy live video chatting.
            </p>
            <div class="flex flex-wrap gap-2 mt-5">
                <span class="px-3.5 py-1.5 border border-gray-300 rounded-lg text-xs font-medium text-gray-700 bg-gray-50/50">Video Call</span>
                <span class="px-3.5 py-1.5 border border-gray-300 rounded-lg text-xs font-medium text-gray-700 bg-gray-50/50">Social</span>
                <span class="px-3.5 py-1.5 border border-gray-300 rounded-lg text-xs font-medium text-gray-700 bg-gray-50/50">Dating</span>
            </div>
        </section>
    </main>
</body>
</html>
